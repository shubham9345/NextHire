server.port=8084

spring.application.name=CompanyService

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/job_db
spring.datasource.username=postgres
spring.datasource.password=${PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Resume uploads for job applications
file.upload-dir=uploads/applications/resumes

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Elasticsearch
spring.elasticsearch.uris=http://localhost:9200
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1

ai.service.url=http://AI-SERVICE