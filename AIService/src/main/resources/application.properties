spring.application.name=AI-SERVICE
server.port = 8086
spring.ai.openai.api-key=${GROQAPIKEY}

spring.ai.openai.base-url=https://api.groq.com/openai/v1

spring.ai.openai.chat.options.model=llama-3.3-70b-versatile

spring.datasource.url=jdbc:postgresql://localhost:5432/ai_db
spring.datasource.username=postgres
spring.datasource.password=${PASSWORD}
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

eureka.instance.hostname=localhost

eureka.instance.prefer-ip-address=true

#eureka.instance.ip-address=127.0.0.1


# Async Thread Pool for AI Evaluation Tasks
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=interview-eval-

# Interview Session Limits
interview.max-questions=10
interview.min-questions=5
interview.session-ttl-minutes=90
interview.max-concurrent-per-user=2

imagekit.public-key=${IMAGEKIT_PUBLIC_KEY}
imagekit.private-key=${IMAGEKIT_PRIVATE_KEY}
imagekit.url-endpoint=${IMAGEKIT_URL_ENDPOINT}
imagekit.interview-reports-folder=/interview-reports
imagekit.interview-audio-folder=/interview-audio

jwt.secret= ${JWT}

# LLM provider ? Groq
llm.groq.api-key=${GROQAPIKEY}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kumarshubham2005a@gmail.com
spring.mail.password= oqay esso psmx btsy

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# Model options:
# llama-3.3-70b-versatile  -> best quality
# llama-3.1-8b-instant     -> fastest
# mixtral-8x7b-32768       -> large context window
llm.groq.model=llama-3.3-70b-versatile

llm.groq.max-tokens=2048
llm.timeout-seconds=30